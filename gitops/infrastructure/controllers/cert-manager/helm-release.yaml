# cert-manager is a hard prerequisite for the CloudNativePG Barman Cloud
# plugin: the plugin's webhook/API server certificates are issued by
# cert-manager. Install it before the plugin.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: cert-manager
      version: ">=1.16.0 <1.20.0"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    # The plugin only needs the API/webhook/cainjector trio; Prometheus
    # integration is optional and off by default.
    prometheus:
      enabled: false
