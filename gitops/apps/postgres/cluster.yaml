# CloudNativePG example cluster on the k3s local-path StorageClass.
#
# Wired into gitops/apps/kustomization.yaml as a LIVE example — Flux deploys it
# on bootstrap. The bootstrap secret is generated there via a kustomize
# secretGenerator with a PLACEHOLDER password; replace it with a SOPS/Sealed-Secret
# value before real use.
#
# Design: a single instance on the single k3s node. HA across nodes is not a
# priority here, so CNPG streaming replication is not used. The data volume uses
# the k3s local-path provisioner (no Longhorn on a single node).
#
# Scheduling: runs on the single untainted k3s node; no nodeSelector/tolerations
# are needed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-sample
  namespace: postgres
spec:
  instances: 1
  storage:
    storageClass: local-path
    size: 1Gi
  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      secret:
        name: pg-sample-app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
