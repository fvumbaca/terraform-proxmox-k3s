# CloudNativePG example cluster on the k3s local-path StorageClass.
#
# Wired into gitops/apps/kustomization.yaml as a LIVE example — Flux deploys it
# on bootstrap. The bootstrap secret is generated there via a kustomize
# secretGenerator with a PLACEHOLDER password; replace it with a SOPS/Sealed-Secret
# value before real use.
#
# Design: a single instance on the dedicated DB node. HA across DB nodes is not
# a priority here, so CNPG streaming replication is not used. The data volume
# uses the k3s local-path provisioner (no Longhorn on a single node). The DB
# node has a 300G data disk at /mnt/sdb1; patch local-path-config so that node's
# path is /mnt/sdb1 if you want CNPG data there instead of the boot disk.
#
# Scheduling: pinned to the dedicated "db" node pool created by the Terraform
# module (node labeled workload=cnpg, tainted dedicated=db:NoSchedule).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-sample
  namespace: postgres
spec:
  instances: 1
  affinity:
    enablePodAntiAffinity: false
    nodeSelector:
      workload: cnpg
    tolerations:
      - key: dedicated
        operator: Equal
        value: db
        effect: NoSchedule
  storage:
    storageClass: local-path
    size: 1Gi
  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      secret:
        name: pg-sample-app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
