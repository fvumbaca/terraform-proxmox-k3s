# CloudNativePG example cluster on the longhorn-cnpg StorageClass.
#
# Wired into gitops/apps/kustomization.yaml as a LIVE example — Flux deploys it
# on bootstrap. The bootstrap secret is generated there via a kustomize
# secretGenerator with a PLACEHOLDER password; replace it with a SOPS/Sealed-Secret
# value before real use.
#
# Design: a single instance on the dedicated DB node. HA across DB nodes is not
# a priority here, so CNPG streaming replication is not used. The data volume is
# single-replica (longhorn-cnpg); reclaimPolicy=Retain means deleting the
# Cluster keeps the volume until you purge it manually:
#   kubectl -n postgres delete cluster pg-sample
#   kubectl delete pv <retained-pvs>
#   kubectl -n longhorn-system delete volume <orphaned-volumes>
#
# Scheduling: pinned to the dedicated "db" node pool created by the Terraform
# module (node labeled workload=cnpg, tainted dedicated=db:NoSchedule).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-sample
  namespace: postgres
spec:
  instances: 1
  affinity:
    enablePodAntiAffinity: false
    nodeSelector:
      workload: cnpg
    tolerations:
      - key: dedicated
        operator: Equal
        value: db
        effect: NoSchedule
  storage:
    storageClass: longhorn-cnpg
    size: 1Gi
  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      secret:
        name: pg-sample-app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
