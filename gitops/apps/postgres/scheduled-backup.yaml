# Daily base backup for pg-sample via the Barman Cloud plugin. The schedule is
# a six-field cron expression (seconds minutes hours day month weekday).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-sample-backup
  namespace: postgres
spec:
  cluster:
    name: pg-sample
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
