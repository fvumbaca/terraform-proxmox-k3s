# Minimal Prometheus Operator wiring for EASY. Apply only if the cluster has
# the Prometheus Operator CRDs (ServiceMonitor / PrometheusRule).
#
# The engine already exposes /metrics on port 8080. The dead-man alert below
# fires when the decision loop has not completed for 45 minutes — the same
# threshold the engine heartbeat uses.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: easy-engine
  namespace: easy
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: easy-engine
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: easy-postgres
  namespace: easy
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: easy-postgres
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: easy-alerts
  namespace: easy
  labels:
    release: prometheus
spec:
  groups:
    - name: easy.rules
      rules:
        - alert: EasyEngineLoopStale
          # Only the leader runs the decision loop; the standby's counter is 0.
          expr: (time() - easy_engine_last_loop_timestamp_seconds) > 2700 and easy_engine_is_leader == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "EASY engine decision loop is stale"
            description: "No completed leader loop for >45 minutes; the desk may be dead."
        - alert: EasyNoLeader
          expr: max(easy_engine_is_leader) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "EASY has no engine leader"
            description: "Both replicas are standby or the lease table is unreachable."
        - alert: EasyLlmErrors
          expr: increase(easy_engine_llm_errors_total[15m]) > 5
          labels:
            severity: warning
          annotations:
            summary: "EASY LLM calls are failing"
            description: "The LLM gateway is erroring; decisions are not being generated."
        - alert: EasyBackupStale
          expr: time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="easy"} > 86400
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "EASY CNPG base backup is stale"
            description: "No successful base backup for >24h."
        - alert: EasyBackupFailed
          expr: barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="easy"} > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="easy"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "EASY CNPG backup failed"
            description: "The most recent backup attempt failed."
        - alert: EasyWalArchivingStale
          expr: cnpg_collector_pg_wal_archive_status{namespace="easy",value="ready"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "EASY WAL archiving is stale"
            description: "WAL segments have been waiting to be archived for >15 minutes."
        - alert: EasyEngineOrderErrors
          expr: increase(easy_engine_order_errors_total[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "EASY order submission errors"
            description: "Alpaca order submissions are failing; check the engine log."
        - alert: EasyEngineDbErrors
          expr: increase(easy_engine_db_errors_total[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "EASY database errors"
            description: "The engine is logging database failures."
        - alert: EasyPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="easy"}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "EASY pod restarted"
            description: "A EASY workload restarted in the last hour."
        - alert: EasyCronJobFailed
          # Only alert on a failure in the last hour; old failed jobs stay in
          # kube-state-metrics forever and would fire indefinitely.
          expr: increase(kube_job_failed{namespace="easy"}[1h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "EASY cron job failed"
            description: "Backup or restore drill failed — check the job history."
