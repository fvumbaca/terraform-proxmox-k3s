# Minimal Prometheus Operator wiring for CEPO. Apply only if the cluster has
# the Prometheus Operator CRDs (ServiceMonitor / PrometheusRule).
#
# The engine already exposes /metrics on port 8080. The dead-man alert below
# fires when the decision loop has not completed for 45 minutes — the same
# threshold the engine heartbeat uses.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cepo-engine
  namespace: cepo
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: cepo-engine
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cepo-postgres
  namespace: cepo
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cepo-postgres
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cepo-alerts
  namespace: cepo
  labels:
    release: prometheus
spec:
  groups:
    - name: cepo.rules
      rules:
        - alert: CepoEngineLoopStale
          # Only the leader runs the decision loop; the standby's counter is 0.
          expr: (time() - cepo_engine_last_loop_timestamp_seconds) > 2700 and cepo_engine_is_leader == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CEPO engine decision loop is stale"
            description: "No completed leader loop for >45 minutes; the desk may be dead."
        - alert: CepoNoLeader
          expr: max(cepo_engine_is_leader) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CEPO has no engine leader"
            description: "Both replicas are standby or the lease table is unreachable."
        - alert: CepoLlmErrors
          expr: increase(cepo_engine_llm_errors_total[15m]) > 5
          labels:
            severity: warning
          annotations:
            summary: "CEPO LLM calls are failing"
            description: "The LLM gateway is erroring; decisions are not being generated."
        - alert: CepoBackupStale
          expr: time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="cepo"} > 86400
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CEPO CNPG base backup is stale"
            description: "No successful base backup for >24h."
        - alert: CepoBackupFailed
          expr: barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="cepo"} > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="cepo"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CEPO CNPG backup failed"
            description: "The most recent backup attempt failed."
        - alert: CepoWalArchivingStale
          expr: cnpg_collector_pg_wal_archive_status{namespace="cepo",value="ready"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "CEPO WAL archiving is stale"
            description: "WAL segments have been waiting to be archived for >15 minutes."
        - alert: CepoEngineOrderErrors
          expr: increase(cepo_engine_order_errors_total[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "CEPO order submission errors"
            description: "Alpaca order submissions are failing; check the engine log."
        - alert: CepoEngineDbErrors
          expr: increase(cepo_engine_db_errors_total[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "CEPO database errors"
            description: "The engine is logging database failures."
        - alert: CepoPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="cepo"}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "CEPO pod restarted"
            description: "A CEPO workload restarted in the last hour."
        - alert: CepoCronJobFailed
          expr: kube_job_failed{namespace="cepo"} > 0
          labels:
            severity: critical
          annotations:
            summary: "CEPO cron job failed"
            description: "Backup or restore drill failed — check the job history."
