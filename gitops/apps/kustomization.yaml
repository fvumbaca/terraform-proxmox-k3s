# Plain kustomize: applications. Add your app manifests / HelmReleases here.
#
# The CloudNativePG example cluster is wired in below as a LIVE example.
# WARNING: the secretGenerator password is a PLACEHOLDER committed in git.
# Replace it with a SOPS/Sealed-Secret-encrypted value before any real use.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./postgres/cluster.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: pg-sample-app
    namespace: postgres
    literals:
      - username=appuser
      - password=changeme-replace-with-sops
