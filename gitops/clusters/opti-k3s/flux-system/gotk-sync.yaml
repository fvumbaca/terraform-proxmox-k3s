# Generated-style Flux sync objects. `flux bootstrap` normally writes these; they
# are provided here as a starting point. Replace the GitRepository `url` with your
# actual git repo (or let `flux bootstrap` regenerate this file).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: ssh://git@YOUR_HOST/YOUR_ORG/opti-k3s-gitops.git
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./clusters/opti-k3s/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  validation: client
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
